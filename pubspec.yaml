name: sharik
description: Sharik is an open-source, cross-platform solution for sharing files via Wi-Fi or Mobile Hotspot
homepage: https://github.com/marchellodev/sharik
repository: https://github.com/marchellodev/sharik
issue_tracker: https://github.com/marchellodev/sharik/issues
publish_to: none
version: 3.2.0+15

environment:
  sdk: '>=2.17.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # UI

  lucide_icons: ^0.88.0

  google_fonts: ^3.0.1

  qr_flutter: ^4.0.0

  wakelock: ^0.6.2

  # UTILS

  # camera QR scanner (ZXing, no Google services needed)
  qr_code_scanner: ^1.0.1
  device_apps: ^2.2.0

#  hive: ^2.0.4
  hive_flutter: ^1.1.0

  file_picker: ^5.0.1

  # ARCHITECTURE
  provider: ^6.0.3

  # required by flutter gen-l10n
  intl: ^0.17.0

dev_dependencies:
  lint: ^1.10.0

flutter:
  generate: true
  uses-material-design: false

  assets:
    - assets/
    - google_fonts/Andika/
    - google_fonts/Comfortaa/

